<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ResumeForge — AI Resume & Interview Prep SaaS{% endblock %}</title>

  <!-- Primary SEO Meta Tags -->
  <meta name="description" content="{% block meta_description %}ResumeForge AI — Free AI ATS Resume Scanner, ATS Score Checker, AI Mock Interview Practice with live voice recognition, Resume Builder, and Tech Salary Estimator.{% endblock %}">
  <meta name="keywords" content="{% block meta_keywords %}AI resume builder, ATS resume scanner, free ATS checker, AI mock interview, interview practice, salary estimator, resume keyword optimizer, Groq AI ATS, tech job preparation{% endblock %}">
  <meta name="author" content="ResumeForge AI">
  <meta name="robots" content="{% block meta_robots %}index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1{% endblock %}">
  <meta name="theme-color" content="#4F46E5">

  <!-- Open Graph / Facebook / LinkedIn / WhatsApp Preview Cards -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ResumeForge AI">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">
  <meta property="og:title" content="{% block og_title %}ResumeForge — AI ATS Resume Scanner & Mock Interview Prep{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Instant ATS score, missing skill gap analysis with free courses, 1-click tailored cover letters, and live Google Meet style AI mock interviews.{% endblock %}">
  <meta property="og:image" content="https://images.unsplash.com/photo-1586281380349-632531db7ed4?w=1200&auto=format&fit=crop&q=80">
  <meta property="og:image:alt" content="ResumeForge AI ATS Scorecard & Live Mock Interview Platform">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}ResumeForge AI — Free ATS Score & AI Mock Interview Arena{% endblock %}">
  <meta name="twitter:description" content="{% block twitter_description %}Score your resume against any job description in seconds. Practice live technical mock interviews with instant voice speech AI feedback.{% endblock %}">
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1586281380349-632531db7ed4?w=1200&auto=format&fit=crop&q=80">

  <!-- Canonical URL Tag -->
  <link rel="canonical" href="{{ request.build_absolute_uri }}">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234F46E5'/><path d='M30 70 L50 30 L70 70 Z' fill='%23FFFFFF'/></svg>">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Custom Design System CSS -->
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/custom.css' %}?v=20260925_10">
  <style>
    :root {
      --rf-primary: #4F46E5;
      --rf-primary-hover: #4338CA;
      --rf-primary-light: rgba(79, 70, 229, 0.08);
      --rf-primary-glow: rgba(79, 70, 229, 0.35);
      --rf-secondary-accent: #8B5CF6;
      --rf-rose-accent: #EC4899;
      --rf-cyan-accent: #06B6D4;
      --rf-success: #10B981;
      --rf-warning: #F59E0B;
      --rf-danger: #EF4444;
      --rf-text-main: #0F172A;
      --rf-text-secondary: #334155;
      --rf-text-muted: #64748B;
      --glass-bg: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(255, 255, 255, 0.65);
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      background-color: transparent !important;
      color: #0F172A;
    }
    .gradient-text {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 50%, #EC4899 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      font-weight: 800;
      display: inline-block;
    }
    .btn-primary-custom {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%) !important;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      color: #FFFFFF !important;
      font-weight: 600;
      border-radius: 10px;
      padding: 0.65rem 1.35rem;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35) !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary-custom:hover {
      background: linear-gradient(135deg, #4338CA 0%, #6D28D9 100%) !important;
      color: #FFFFFF !important;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.45) !important;
    }
    .btn-outline-custom {
      background: #FFFFFF !important;
      border: 1px solid #CBD5E1 !important;
      color: #0F172A !important;
      font-weight: 600;
      border-radius: 10px;
      padding: 0.65rem 1.35rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-outline-custom:hover {
      background: #F8FAFC !important;
      border-color: #4F46E5 !important;
      color: #4F46E5 !important;
      transform: translateY(-2px);
    }
    .glass-card, .card-custom {
      background: rgba(255, 255, 255, 0.82) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid rgba(255, 255, 255, 0.7) !important;
      border-radius: 16px !important;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.06), 0 2px 8px 0 rgba(0, 0, 0, 0.02) !important;
    }
    .navbar-custom {
      background: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border-bottom: 1px solid rgba(226, 232, 240, 0.8) !important;
    }
  </style>

  <!-- Three.js (r128) 3D Animated Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="{% static 'js/bg-animation.js' %}?v=20260925_10" defer></script>

  <!-- Global JSON-LD Structured Data Schema for Google Rich Snippets -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://resume-hn9o.onrender.com/#organization",
        "name": "ResumeForge AI",
        "url": "https://resume-hn9o.onrender.com",
        "logo": "https://resume-hn9o.onrender.com/favicon.ico",
        "description": "Next-Generation AI ATS Resume Scanner, Live Mock Interview Prep, and Tech Career Suite."
      },
      {
        "@type": "WebApplication",
        "@id": "https://resume-hn9o.onrender.com/#webapp",
        "name": "ResumeForge AI Suite",
        "url": "https://resume-hn9o.onrender.com",
        "applicationCategory": "BusinessApplication, EducationalApplication",
        "operatingSystem": "All (Web Browser, Mobile Responsive)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "category": "FreeTier"
        },
        "featureList": [
          "AI ATS Resume Scorecard with Semantic Keyword Parsing",
          "Multi-Format Resume Upload (PDF, Word DOCX/DOC, Text TXT/RTF)",
          "Free Skill Gaps Learning Resources",
          "1-Click Tailored AI Cover Letter Copywriter",
          "Google Meet Style Live Video Mock Interview with Voice AI",
          "Interactive Coding & MCQ Practice Arena",
          "Tech Salary Estimator and Public Verified Candidate Profile"
        ]
      }
    ]
  }
  </script>

  {% block schema_markup %}{% endblock %}

  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- 3D Animated Background Canvas (Strict Fixed Background Layer) -->
  <canvas id="bg-canvas" style="position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: -1 !important; pointer-events: none !important; display: block !important;"></canvas>

  <!-- Global Top Navbar -->
  {% include 'includes/navbar.html' %}

  <!-- Main Content Container -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Global Footer -->
  {% include 'includes/footer.html' %}

  <!-- Bootstrap 5 JS Bundle with Popper CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
