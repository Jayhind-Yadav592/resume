<script>
  // Dynamic client-side authentication state detection
  document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('resumeforge_access_token');
    const publicLinks = document.getElementById('nav-public-links');
    const authLinks = document.getElementById('nav-auth-links');
    const loggedOutActions = document.getElementById('nav-logged-out-actions');
    const loggedInActions = document.getElementById('nav-logged-in-actions');
    const userNameSpan = document.getElementById('nav-user-name');

    if (token) {
      if (publicLinks) publicLinks.classList.add('d-none');
      if (authLinks) authLinks.classList.remove('d-none');
      if (loggedOutActions) loggedOutActions.classList.add('d-none');
      if (loggedInActions) {
        loggedInActions.classList.remove('d-none');
        loggedInActions.classList.add('d-flex');
      }

      // Fetch user profile if cached name not set
      fetch('/api/v1/auth/me/', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(user => {
        if (userNameSpan) {
          userNameSpan.textContent = user.first_name || user.username;
        }
      })
      .catch(() => {
        // Invalid or expired token
        localStorage.removeItem('resumeforge_access_token');
        localStorage.removeItem('resumeforge_refresh_token');
        if (publicLinks) publicLinks.classList.remove('d-none');
        if (authLinks) authLinks.classList.add('d-none');
        if (loggedOutActions) loggedOutActions.classList.remove('d-none');
        if (loggedInActions) loggedInActions.classList.add('d-none');
      });
    }
  });

  function handleGlobalLogout() {
    localStorage.removeItem('resumeforge_access_token');
    localStorage.removeItem('resumeforge_refresh_token');
    window.location.href = '/login/';
  }
</script>
